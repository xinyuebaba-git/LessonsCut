[project]
name = "lessonscut"
version = "0.2.0"
description = "Evidence-driven course video editing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "pydantic-settings>=2,<3",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.18",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
asr = [
    "faster-whisper==1.2.1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
